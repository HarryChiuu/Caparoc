# pytest 設定 — CAPAROC 控制器
#
# 導入動機：2026-09-04 直接執行 `pytest` 會**整套中止**，不是某個測試失敗，
# 而是 collection error：`tests/test_network_info.py` 其實是手動診斷腳本，
# 在 module 頂層就 `with CIPDriver(IP)` 連線真實設備（見該檔案 import 期間的
# 副作用）。沒有實機時 pytest 連收集階段都過不了，25 個能跑的測試因此
# 一個都跑不到——安全網形同不存在。
#
# 解法分兩層：
#   1. 那四支互動式／需實機的工具已改名並移到 `tests/manual/`（不以 test_ 開頭，
#      pytest 不再收集）。它們仍是有價值的手動工具，只是不屬於自動化測試。
#   2. 這份設定把收集範圍釘死在 `tests/`，並明確排除 `tests/manual`，
#      避免日後再有人把手動腳本命名成 test_*.py 而重蹈覆轍。
#
# 用法：
#   python -m pytest              # 跑全部自動化測試（不需實機、不需網路）
#   python -m pytest -q           # 精簡輸出

[pytest]
testpaths = tests
norecursedirs = tests/manual archive output logs .git .claude *.egg-info

# 只收 test_ 開頭的檔案。`tests/manual/` 內的工具一律用 check_*.py 或
# *_tool.py 命名，與 tests/check_connection.py、tests/diagnostic_tools.py
# 的既有慣例一致。
python_files = test_*.py
python_functions = test_*
python_classes = Test*
