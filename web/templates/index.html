<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPAROC 控制台</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4.2.3" />
</head>
<body>
    <div id="app">

        <!-- 頂部固定列 -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" @click="toggleSidebar" title="展開/收合選單">☰</button>
                <span class="brand">CAPAROC</span>
            </div>
            <div class="conn-bar">
                <span class="dot" :class="state.connected ? 'dot-on' : 'dot-off'"></span>
                <span class="conn-label">
                    {{ state.connected ? '已連線 · ' + state.device_ip : '未連線' }}
                </span>
                <button class="btn-sm" v-if="!state.connected" @click="doConnect" :disabled="connecting">{{ connecting ? '連線中...' : '連線' }}</button>
                <button class="btn-sm btn-danger" v-else @click="doDisconnect">斷線</button>
            </div>
        </header>

        <!-- 主版面 -->
        <div class="layout">

            <!-- 左側導覽列 -->
            <nav class="sidebar" :class="{ collapsed: sidebarCollapsed }">
                <ul class="nav-list">
                    <li v-for="item in navItems" :key="item.page"
                        class="nav-item"
                        :class="{ active: currentPage === item.page }"
                        @click="navigate(item.page)">
                        <span class="nav-icon">{{ item.icon }}</span>
                        <span class="nav-label">{{ item.label }}</span>
                    </li>
                </ul>
            </nav>

            <!-- 主內容區域 -->
            <main class="main-content">

                <!-- 儀表板 -->
                <template v-if="currentPage === 'dashboard'">

                    <section class="panel" v-if="state.connected">
                        <h2>系統狀態</h2>
                        <div class="sys-grid">
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.voltage) }}<span class="unit">V</span></div>
                                <div class="stat-label">輸入電壓</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.total_current) }}<span class="unit">A</span></div>
                                <div class="stat-label">總電流</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ state.module_count }}</div>
                                <div class="stat-label">模組數量</div>
                            </div>
                            <div class="stat-box" v-if="state.undervoltage || state.overvoltage || state.system_error">
                                <div class="stat-val warn-text">⚠</div>
                                <div class="stat-label">
                                    <span v-if="state.undervoltage">欠壓 </span>
                                    <span v-if="state.overvoltage">過壓 </span>
                                    <span v-if="state.system_error">系統錯誤</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel" v-if="state.connected && state.channels.length">
                        <h2>通道控制</h2>
                        <div class="ch-grid">
                            <div class="ch-card"
                                 v-for="ch in state.channels" :key="ch.id"
                                 :class="cardClass(ch)">
                                <div class="ch-top">
                                    <span class="ch-name">CH{{ ch.id }}</span>
                                    <span class="ch-mod">M{{ ch.module }}</span>
                                    <button class="toggle-btn" @click="toggleCh(ch)">
                                        {{ ch.on ? '關閉' : '開啟' }}
                                    </button>
                                </div>
                                <div class="ch-current">{{ fmt(ch.current_amps) }} <span class="unit">A</span></div>
                                <div class="bar-wrap">
                                    <div class="bar-fill" :style="{ width: barPct(ch) + '%' }"
                                         :class="barClass(ch)"></div>
                                </div>
                                <div class="ch-meta">
                                    額定 {{ ch.nominal_amps }} A
                                    <span class="pct">{{ barPct(ch).toFixed(0) }}%</span>
                                </div>
                                <div class="ch-flags">
                                    <span class="flag warn" v-if="ch.warn_80">80%</span>
                                    <span class="flag fault" v-if="ch.overload">過載</span>
                                    <span class="flag fault" v-if="ch.short_circuit">短路</span>
                                    <span class="flag fault" v-if="ch.hardware_fault">硬體故障</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel center" v-if="!state.connected">
                        <h2>尚未連線</h2>
                        <p class="hint-text">請前往「連線設定」頁面建立連線</p>
                        <button class="btn" style="margin-top:16px" @click="navigate('connection')">前往連線設定</button>
                    </section>

                </template>

                <!-- 圖表監控 -->
                <template v-if="currentPage === 'charts'">
                    <section class="panel">
                        <div class="chart-header">
                            <h2>圖表監控</h2>
                            <div class="chart-toolbar">
                                <div class="chart-win-btns">
                                    <button :class="['btn','btn-sm', chartWindow===30?'':'btn-ghost']"   @click="setChartWindow(30)">30s</button>
                                    <button :class="['btn','btn-sm', chartWindow===60?'':'btn-ghost']"   @click="setChartWindow(60)">1分</button>
                                    <button :class="['btn','btn-sm', chartWindow===600?'':'btn-ghost']"  @click="setChartWindow(600)">10分</button>
                                    <button :class="['btn','btn-sm', chartWindow===1800?'':'btn-ghost']" @click="setChartWindow(1800)">30分</button>
                                </div>
                                <button v-if="chartHistoryMode" class="btn btn-sm" @click="jumpToLive" title="回到最新資料">▶ 即時</button>
                                <button :class="['btn','btn-sm', chartPaused?'btn-ghost':'']" @click="toggleChartPause">
                                    {{ chartPaused ? '▶ 恢復' : '⏸ 暫停' }}
                                </button>
                            </div>
                        </div>

                        <div v-if="!state.connected" class="placeholder">
                            <div class="placeholder-icon">📈</div>
                            <div class="placeholder-title">尚未連線</div>
                            <div class="placeholder-desc">請先建立設備連線後查看圖表</div>
                        </div>

                        <template v-else>
                            <!-- 全域曲線 -->
                            <div class="chart-section">
                                <h3 class="chart-subtitle">電壓 / 總電流</h3>
                                <div class="chart-wrap">
                                    <canvas id="globalChart"></canvas>
                                </div>
                            </div>

                            <!-- 各模組通道電流（每模組一張圖） -->
                            <div v-for="mod in activeModules" :key="mod"
                                 class="chart-section" style="margin-top:20px">
                                <div class="chart-section-header">
                                    <h3 class="chart-subtitle">M{{ mod }} 通道電流</h3>
                                    <div class="chart-ch-checks">
                                        <label v-for="ch in channelsByModule[mod]" :key="ch.id"
                                               class="ch-check-label">
                                            <input type="checkbox"
                                                   :checked="chartChannelVisible[ch.id] !== false"
                                                   @change="toggleChannelVisible(ch.id)" />
                                            <span>CH{{ ch.channel }}</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="chart-wrap">
                                    <canvas :id="'moduleChart-' + mod"></canvas>
                                </div>
                            </div>
                        </template>
                    </section>
                </template>

                <!-- 通道設定 -->
                <template v-if="currentPage === 'channel-settings'">
                    <section class="panel">
                        <h2>通道設定</h2>

                        <!-- 未連線 -->
                        <div v-if="!state.connected" class="placeholder">
                            <div class="placeholder-icon">⚙️</div>
                            <div class="placeholder-title">尚未連線</div>
                            <div class="placeholder-desc">請先建立設備連線後再設定通道</div>
                        </div>

                        <template v-else>
                            <!-- 批次套用 -->
                            <div class="batch-bar">
                                <span style="font-size:0.82rem;color:#7a8aaa;white-space:nowrap">全部套用</span>
                                <input type="number" v-model="batchNominal"
                                       min="1" max="20" step="1"
                                       placeholder="A" class="nominal-input" />
                                <button class="btn" @click="setAllNominal">套用至全部通道</button>
                                <span class="feedback-msg"
                                      :class="batchStatus.ok ? 'ok' : 'err'"
                                      v-if="batchStatus.msg">{{ batchStatus.msg }}</span>
                            </div>

                            <!-- 通道表格 -->
                            <table class="ch-table">
                                <thead>
                                    <tr>
                                        <th>通道</th>
                                        <th>模組</th>
                                        <th>目前額定電流</th>
                                        <th>新值 (A)</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="ch in state.channels" :key="ch.id">
                                        <td class="td-ch">CH{{ ch.id }}</td>
                                        <td class="td-mod">M{{ ch.module }}</td>
                                        <td class="td-nominal">{{ ch.nominal_amps }} A</td>
                                        <td>
                                            <input type="number"
                                                   v-model="nominalInputs[ch.id]"
                                                   min="1" max="20" step="1"
                                                   :placeholder="ch.nominal_amps"
                                                   class="nominal-input" />
                                        </td>
                                        <td>
                                            <button class="btn" @click="setNominal(ch.id)">設定</button>
                                            <span class="feedback-msg"
                                                  :class="nominalFeedback[ch.id]?.ok ? 'ok' : 'err'"
                                                  v-if="nominalFeedback[ch.id]?.msg">
                                                {{ nominalFeedback[ch.id].msg }}
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </template>

                    </section>
                </template>

                <!-- 系統日誌 -->
                <template v-if="currentPage === 'logs'">
                    <section class="panel">
                        <!-- 標題列 + 工具列 -->
                        <div class="log-header">
                            <h2>系統日誌</h2>
                            <div class="log-toolbar">
                                <select v-model="logFilter" class="log-select">
                                    <option value="all">全部等級</option>
                                    <option value="warn">WARNING+</option>
                                    <option value="error">ERROR</option>
                                </select>
                                <div class="log-pagesize">
                                    <button :class="['btn', 'btn-sm', logPageSize === 10 ? '' : 'btn-ghost']"
                                            @click="setPageSize(10)">10</button>
                                    <button :class="['btn', 'btn-sm', logPageSize === 20 ? '' : 'btn-ghost']"
                                            @click="setPageSize(20)">20</button>
                                </div>
                                <button :class="['btn', 'btn-sm', logAutoScroll ? '' : 'btn-ghost']"
                                        @click="toggleLogAuto"
                                        :title="logAutoScroll ? '點擊暫停自動更新' : '點擊開啟自動更新'">
                                    {{ logAutoScroll ? '⏸ 暫停' : '▶ 自動更新' }}
                                </button>
                                <button class="btn btn-sm btn-ghost" @click="fetchLogs" title="立即重新整理">重整</button>
                                <button class="btn btn-sm btn-danger" @click="clearLogs">清空</button>
                            </div>
                        </div>

                        <!-- 日誌表格 -->
                        <div class="log-table-wrap">
                            <div class="log-empty" v-if="logEntries.length === 0">目前無日誌記錄</div>
                            <table class="log-table" v-else>
                                <colgroup>
                                    <col class="col-time" />
                                    <col class="col-level" />
                                    <col />
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>時間</th>
                                        <th>等級</th>
                                        <th>訊息</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="e in logEntries" :key="e.id"
                                        :class="'log-row log-row-' + e.level.toLowerCase()">
                                        <td class="log-time">{{ e.time }}</td>
                                        <td>
                                            <span :class="'log-badge log-' + e.level.toLowerCase()">
                                                {{ e.level }}
                                            </span>
                                        </td>
                                        <td class="log-msg">{{ e.msg }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 分頁列 -->
                        <div class="log-pagination">
                            <span class="log-total">共 {{ logTotal }} 筆</span>
                            <div class="log-pager" v-if="logTotalPages > 1">
                                <button class="btn btn-sm btn-ghost"
                                        @click="logPrevPage" :disabled="logPage === 0">‹</button>
                                <span class="log-page-info">{{ logPage + 1 }} / {{ logTotalPages }}</span>
                                <button class="btn btn-sm btn-ghost"
                                        @click="logNextPage"
                                        :disabled="logPage >= logTotalPages - 1">›</button>
                            </div>
                        </div>
                    </section>
                </template>

                <!-- 連線設定 -->
                <template v-if="currentPage === 'connection'">
                    <section class="panel">
                        <h2>連線設定</h2>
                        <div class="conn-form-block">
                            <label class="field-label">設備 IP 位址</label>
                            <div class="conn-form">
                                <input v-model="ipInput" placeholder="192.168.50.111" @keyup.enter="doConnect" />
                                <button class="btn" v-if="!state.connected" @click="doConnect" :disabled="connecting">{{ connecting ? '連線中...' : '連線' }}</button>
                                <button class="btn btn-danger" v-else @click="doDisconnect">斷線</button>
                            </div>
                            <p class="err-msg" v-if="state.error">{{ state.error }}</p>
                            <p class="conn-status-text" v-if="state.connected">
                                ✅ 已連線至 {{ state.device_ip }}，{{ state.module_count }} 個模組
                            </p>
                        </div>
                    </section>
                </template>

            </main>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="/static/js/app.js?v=4.2.6a"></script>
</body>
</html>
