<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPAROC 控制台</title>
    <!-- 開頁前先套用主題，避免夜間/白天閃爍 -->
    <script>
        try {
            document.documentElement.setAttribute(
                'data-theme', localStorage.getItem('caparoc_theme') || 'dark');
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="/static/css/style.css?v={{ app_version }}" />
</head>

<body>
    <div id="app">

        <!-- 頂部固定列 -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" @click="toggleSidebar" title="展開/收合選單">☰</button>
                <span class="brand">CAPAROC PM EIP ECB controller</span>
            </div>
            <div class="topbar-right">
                <div class="conn-bar">
                    <span class="dot" :class="state.connected ? 'dot-on' : 'dot-off'"></span>
                    <span class="conn-label">
                        {{ state.connected ? '已連線 · ' + state.device_ip : '未連線' }}
                    </span>
                    <button class="btn-sm" v-if="!state.connected" @click="doConnect" :disabled="connecting">{{
                        connecting ? '連線中...' : '連線' }}</button>
                    <button class="btn-sm btn-danger" v-else @click="doDisconnect">斷線</button>
                </div>
                <div class="topbar-sep"></div>
                <button class="theme-toggle" @click="toggleTheme"
                    :title="theme === 'dark' ? 'Dark mode (click for light)' : 'Light mode (click for dark)'">
                    <svg v-if="theme === 'dark'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.11-1.36a5.4 5.4 0 0 1-7.53-7.53C12.92 3.04 12.46 3 12 3z" />
                    </svg>
                    <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>
                <div class="topbar-sep"></div>
                <button class="btn-close-tab" @click="doCloseTab" :disabled="isShuttingDown"
                    :title="isShuttingDown ? '關閉中...' : '關閉伺服器'">{{ isShuttingDown ? '⏹' : '✕' }}</button>
            </div>
        </header>

        <!-- 主版面 -->
        <div class="layout">

            <!-- 左側導覽列 -->
            <nav class="sidebar" :class="{ collapsed: sidebarCollapsed }">
                <ul class="nav-list">
                    <li v-for="item in navItems" :key="item.page" class="nav-item" :title="item.label"
                        :class="{ active: currentPage === item.page }" @click="navigate(item.page)">
                        <span class="nav-icon">{{ item.icon }}</span>
                        <span class="nav-label">{{ item.label }}</span>
                    </li>
                </ul>
            </nav>

            <!-- 主內容區域 -->
            <main class="main-content">

                <!-- 儀表板 -->
                <template v-if="currentPage === 'dashboard'">

                    <section class="panel" v-if="state.connected || wasEverConnected">
                        <h2>系統狀態</h2>
                        <div v-if="!state.connected" class="stale-banner">⚠ 資料已停止更新，顯示斷線前最後資料</div>
                        <div class="sys-grid">
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.voltage) }}<span class="unit">V</span></div>
                                <div class="stat-label">輸入電壓</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.total_current) }}<span class="unit">A</span></div>
                                <div class="stat-label">總電流</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ state.module_count }}</div>
                                <div class="stat-label">模組數量</div>
                            </div>
                            <div class="stat-box" v-if="state.undervoltage || state.overvoltage || state.system_error">
                                <div class="stat-val warn-text">⚠</div>
                                <div class="stat-label">
                                    <span v-if="state.undervoltage">欠壓 </span>
                                    <span v-if="state.overvoltage">過壓 </span>
                                    <span v-if="state.system_error">系統錯誤</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel" v-if="(state.connected || wasEverConnected) && state.channels.length">
                        <h2>通道控制</h2>
                        <div v-if="!state.connected" class="stale-banner">⚠ 資料已停止更新，顯示斷線前最後資料</div>
                        <div class="mod-group" v-for="mod in activeModules" :key="mod">
                            <div class="mod-header">
                                <span class="mod-title">模組 {{ mod }}</span>
                                <span class="mod-ch-count">{{ channelsByModule[mod].length }} 通道</span>
                            </div>
                            <div class="ch-grid">
                                <div class="ch-card" v-for="ch in channelsByModule[mod]" :key="ch.id"
                                    :class="[cardClass(ch), !state.connected ? 'stale' : '', channelToggleError[ch.id] ? 'toggle-err' : '']">
                                    <div class="ch-top">
                                        <span class="ch-name">CH{{ ch.channel }}</span>
                                        <!-- 標籤在儀表板上唯讀顯示：卡片已有電流／長條／額定／旗標四層資訊，
                                             再塞一個常駐輸入框會過擠。編輯集中在「通道設定」頁。 -->
                                        <span class="ch-label" v-if="channelLabels[ch.id]"
                                            :title="channelLabels[ch.id]">{{ channelLabels[ch.id] }}</span>
                                        <button class="toggle-btn" :class="ch.on ? 'is-on' : 'is-off'"
                                            @click="toggleCh(ch)" :disabled="!state.connected || channelToggling[ch.id]"
                                            :title="channelToggleError[ch.id] ? '操作失敗，請確認設備連線' : ''">
                                            {{ ch.on ? '關閉' : '開啟' }}
                                        </button>
                                    </div>
                                    <div class="ch-current">{{ fmt(ch.current_amps) }} <span class="unit">A</span></div>
                                    <div class="bar-wrap">
                                        <div class="bar-fill" :style="{ width: barPct(ch) + '%' }"
                                            :class="barClass(ch)"></div>
                                    </div>
                                    <div class="ch-meta">
                                        額定 {{ ch.nominal_amps }} A
                                        <span class="pct">{{ barPct(ch).toFixed(0) }}%</span>
                                    </div>
                                    <div class="ch-flags">
                                        <span class="flag warn" v-if="ch.warn_80">80%</span>
                                        <span class="flag fault" v-if="ch.overload">過載</span>
                                        <span class="flag fault" v-if="ch.short_circuit">短路</span>
                                        <span class="flag fault" v-if="ch.hardware_fault">硬體故障</span>
                                        <span class="flag fault" v-if="ch.total_shutdown">總關斷</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel center" v-if="!state.connected && !wasEverConnected">
                        <h2>尚未連線</h2>
                        <p class="hint-text">請前往「連線設定」頁面建立連線</p>
                        <button class="btn" style="margin-top:16px" @click="navigate('connection')">前往連線設定</button>
                    </section>

                </template>

                <!-- 圖表監控 -->
                <template v-if="currentPage === 'charts'">
                    <section class="panel">
                        <div class="chart-header">
                            <h2>圖表監控</h2>
                            <div class="chart-toolbar">
                                <div class="chart-win-btns">
                                    <button :class="['btn','btn-sm', chartWindow===30?'':'btn-ghost']"
                                        @click="setChartWindow(30)">30s</button>
                                    <button :class="['btn','btn-sm', chartWindow===60?'':'btn-ghost']"
                                        @click="setChartWindow(60)">1分</button>
                                    <button :class="['btn','btn-sm', chartWindow===600?'':'btn-ghost']"
                                        @click="setChartWindow(600)">10分</button>
                                    <button :class="['btn','btn-sm', chartWindow===1800?'':'btn-ghost']"
                                        @click="setChartWindow(1800)">30分</button>
                                </div>
                                <button v-if="chartHistoryMode" class="btn btn-sm" @click="jumpToLive" title="回到最新資料">▶
                                    即時</button>
                                <button :class="['btn','btn-sm', chartPaused?'btn-ghost':'']" @click="toggleChartPause">
                                    {{ chartPaused ? '▶ 恢復' : '⏸ 暫停' }}
                                </button>
                            </div>
                        </div>

                        <div v-if="!state.connected && !wasEverConnected" class="placeholder">
                            <div class="placeholder-icon">📈</div>
                            <div class="placeholder-title">尚未連線</div>
                            <div class="placeholder-desc">請先建立設備連線後查看圖表</div>
                        </div>

                        <div v-if="!state.connected && wasEverConnected" class="stale-banner">⚠ 資料已停止更新，顯示斷線前最後資料</div>

                        <template v-if="state.connected || wasEverConnected">
                            <!-- 全域曲線 -->
                            <div class="chart-section">
                                <h3 class="chart-subtitle">電壓 / 總電流</h3>
                                <div class="chart-wrap">
                                    <canvas id="globalChart"></canvas>
                                </div>
                            </div>

                            <!-- 各模組通道電流（每模組一張圖） -->
                            <div v-for="mod in activeModules" :key="mod" class="chart-section" style="margin-top:20px">
                                <div class="chart-section-header">
                                    <h3 class="chart-subtitle">M{{ mod }} 通道電流</h3>
                                    <div class="chart-ch-checks">
                                        <label v-for="ch in channelsByModule[mod]" :key="ch.id" class="ch-check-label">
                                            <input type="checkbox" :checked="chartChannelVisible[ch.id] !== false"
                                                @change="toggleChannelVisible(ch.id)" />
                                            <span>CH{{ ch.channel }}</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="chart-wrap">
                                    <canvas :id="'moduleChart-' + mod"></canvas>
                                </div>
                            </div>
                        </template>
                    </section>
                </template>

                <!-- 通道設定 -->
                <template v-if="currentPage === 'channel-settings'">
                    <section class="panel">
                        <h2>通道設定</h2>
                        <p class="hint-text label-scope-note">
                            通道名稱僅儲存在<strong>這台電腦</strong>（<code>config.json</code>），以設備序號綁定——
                            設備換 IP 名稱會跟著走，但換一台電腦操作時需重新輸入，或把設定檔一起複製過去。
                        </p>

                        <!-- 未連線且從未連線過：顯示佔位符 -->
                        <div v-if="!state.connected && !wasEverConnected" class="placeholder">
                            <div class="placeholder-icon">⚙️</div>
                            <div class="placeholder-title">尚未連線</div>
                            <div class="placeholder-desc">請先建立設備連線後再設定通道</div>
                        </div>

                        <template v-if="state.connected || wasEverConnected">
                            <div v-if="!state.connected" class="stale-banner">⚠ 資料已停止更新，顯示斷線前最後資料</div>

                            <!-- 全域批次列 -->
                            <div class="batch-bar">
                                <span class="batch-label">全部套用</span>
                                <input type="number" v-model="batchNominal" :min="limits.nominalMin" :max="limits.nominalMax" step="1" placeholder="A"
                                    class="nominal-input" :disabled="!state.connected || batchBusy" />
                                <button class="btn" @click="setAllNominal" :disabled="!state.connected || batchBusy">
                                    {{ batchBusy ? '設定中…' : '套用至全部通道' }}
                                </button>
                                <span class="feedback-msg" :class="batchStatus.ok ? 'ok' : 'err'"
                                    v-if="batchStatus.msg" :title="batchStatus.msg">{{ batchStatus.msg }}</span>
                            </div>

                            <!-- 各模組區塊 -->
                            <div class="mod-group" v-for="mod in activeModules" :key="mod">
                                <div class="mod-header">
                                    <span class="mod-title">模組 {{ mod }}</span>
                                    <span class="mod-ch-count">{{ channelsByModule[mod].length }} 通道</span>
                                    <button class="mod-readonly-badge" v-if="modFixedNominal(mod) != null"
                                        @click="openNominalHelp(mod)" title="此型號額定電流固定，無法調整">
                                        🔧 固定 {{ modFixedNominal(mod) }}A（不可調整） ℹ️
                                    </button>
                                    <button class="mod-readonly-badge warn" v-else-if="isModNominalReadOnly(mod)"
                                        @click="openNominalHelp(mod)" title="點擊查看如何開啟遠端設定">
                                        🔒 目前無法遠端設定 — 查看解法 ℹ️
                                    </button>
                                    <button class="mod-readonly-badge" v-else-if="isModRotary(mod)"
                                        @click="openNominalHelp(mod)" title="此模組為旋鈕型，點擊查看說明">
                                        🎛️ 旋鈕型（RC 已開啟） ℹ️
                                    </button>
                                </div>

                                <!-- 模組批次列 -->
                                <div class="mod-batch-bar">
                                    <span class="batch-label">本模組套用</span>
                                    <input type="number" v-model="batchNominalByMod[mod]" :min="modRange(mod).min" :max="modRange(mod).max" step="1"
                                        placeholder="A" class="nominal-input"
                                        :title="modFixedNominal(mod) != null ? '此型號額定電流固定，無法調整' : (isModNominalReadOnly(mod) ? '此模組旋鈕不在 RC 位置，無法遠端設定——點右上角說明' : '')"
                                        :disabled="!state.connected || isModNominalReadOnly(mod) || batchBusyByMod[mod]" />
                                    <button class="btn btn-sm" @click="setModuleNominal(mod)"
                                        :title="modFixedNominal(mod) != null ? '此型號額定電流固定，無法調整' : (isModNominalReadOnly(mod) ? '此模組旋鈕不在 RC 位置，無法遠端設定——點右上角說明' : '')"
                                        :disabled="!state.connected || isModNominalReadOnly(mod) || batchBusyByMod[mod]">
                                        {{ batchBusyByMod[mod] ? '設定中…' : '套用' }}
                                    </button>
                                    <span class="feedback-msg" :class="batchStatusByMod[mod]?.ok ? 'ok' : 'err'"
                                        v-if="batchStatusByMod[mod]?.msg" :title="batchStatusByMod[mod].msg">{{
                                        batchStatusByMod[mod].msg }}</span>
                                </div>

                                <!-- 通道表格 -->
                                <table class="ch-table">
                                    <colgroup>
                                        <col class="col-ch" />
                                        <col class="col-label" />
                                        <col class="col-nominal" />
                                        <col class="col-input" />
                                        <col />
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th>通道</th>
                                            <th>名稱</th>
                                            <th>目前額定電流</th>
                                            <th>新值 (A)</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="ch in channelsByModule[mod]" :key="ch.id">
                                            <td class="td-ch">CH{{ ch.channel }}</td>
                                            <td class="td-label">
                                                <input type="text" class="label-input"
                                                    :value="channelLabels[ch.id] ?? ''"
                                                    @blur="saveLabel(ch.id, $event.target.value)"
                                                    @keyup.enter="$event.target.blur()"
                                                    :maxlength="LABEL_MAX_LEN"
                                                    :disabled="labelBusy[ch.id]"
                                                    placeholder="未命名"
                                                    title="為這個通道命名，例如「主機電源」。僅存在本機。" />
                                                <span class="feedback-msg" :class="labelFeedback[ch.id]?.ok ? 'ok' : 'err'"
                                                    v-if="labelFeedback[ch.id]?.msg">{{ labelFeedback[ch.id].msg }}</span>
                                            </td>
                                            <td class="td-nominal">{{ ch.nominal_amps }} A</td>
                                            <td>
                                                <input type="number" v-model="nominalInputs[ch.id]" :min="modRange(ch.module).min" :max="modRange(ch.module).max"
                                                    step="1" :placeholder="ch.nominal_amps" class="nominal-input"
                                                    :title="modFixedNominal(ch.module) != null ? '此型號額定電流固定，無法調整' : (isModNominalReadOnly(ch.module) ? '此模組旋鈕不在 RC 位置，無法遠端設定——點模組標題列的說明' : '')"
                                                    :disabled="!state.connected || isModNominalReadOnly(ch.module) || nominalBusy[ch.id]" />
                                            </td>
                                            <td>
                                                <div class="td-action">
                                                    <button class="btn btn-sm" @click="setNominal(ch.id)"
                                                        :title="modFixedNominal(ch.module) != null ? '此型號額定電流固定，無法調整' : (isModNominalReadOnly(ch.module) ? '此模組旋鈕不在 RC 位置，無法遠端設定——點模組標題列的說明' : '')"
                                                        :disabled="!state.connected || isModNominalReadOnly(ch.module) || nominalBusy[ch.id]">
                                                        {{ nominalBusy[ch.id] ? '設定中…' : '設定' }}
                                                    </button>
                                                    <span class="feedback-msg"
                                                        :class="nominalFeedback[ch.id]?.ok ? 'ok' : 'err'"
                                                        v-if="nominalFeedback[ch.id]?.msg"
                                                        :title="nominalFeedback[ch.id].msg">
                                                        {{ nominalFeedback[ch.id].msg }}
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                    </section>

                    <!-- 旋鈕型模組（2 通道）額定電流設定說明 Modal -->
                    <div class="modal-overlay" v-if="showNominalHelp" @click.self="showNominalHelp = false">
                        <div class="modal-box wide">
                            <div class="modal-header">
                                <span v-if="modFixedNominal(helpMod) != null">
                                    🔧 模組 {{ helpMod }}：固定額定電流型號
                                </span>
                                <span v-else>🎛️ 旋鈕型模組（2 通道）如何設定額定電流</span>
                                <button class="modal-close" @click="showNominalHelp = false">✕</button>
                            </div>

                            <!-- 固定額定型號（如 E1 12-24DC/16A）：硬體不可調，與旋鈕未轉 RC 無關 -->
                            <div class="modal-body" v-if="modFixedNominal(helpMod) != null">
                                <p class="modal-note">
                                    此模組的額定電流<strong>固定為 {{ modFixedNominal(helpMod) }} A</strong>，
                                    由型號決定，<strong>無法透過本頁或設備按鈕調整</strong>。
                                </p>
                                <p class="modal-note">
                                    依原廠手冊 6.1.1：只有型號中標示<strong>電流範圍</strong>的模組才能程式化設定
                                    （例如 <code>1-4A</code>、<code>2-10A</code>）。型號只標單一安培數
                                    （例如 <code>16A</code>）即為固定額定型。
                                </p>
                                <p class="modal-warn">
                                    ⓘ 需要不同的額定電流時，只能<strong>更換為可調型模組</strong>。
                                    這與 2 通道模組「旋鈕未轉到 RC」是不同狀況——那種情況可自行解除。
                                </p>
                            </div>

                            <!-- 旋鈕型（2 通道）：可調，但需先轉到 RC -->
                            <div class="modal-body" v-else>
                                <p class="modal-note">
                                    2 通道模組（如 CAPAROC E2）的額定電流由<strong>模組正面的實體旋鈕</strong>決定。
                                    旋鈕上除了安培刻度，還有一個 <strong>RC</strong>（Remote Control）位置——
                                    <strong>只有轉到 RC，才能從這個網頁遠端設定</strong>。
                                </p>

                                <h4 class="modal-sub">方式 A：開啟遠端設定（建議，可用本頁批次套用）</h4>
                                <ol class="modal-steps">
                                    <li>把該通道的旋鈕轉到 <strong>RC</strong> 位置（不是安培刻度）</li>
                                    <li><strong>長按該通道的 LED 按鈕 &gt; 2 秒</strong>存檔</li>
                                    <li>LED 停止閃爍 → RC 模式已生效</li>
                                    <li>模組有幾個通道，就要<strong>每個通道各做一次</strong></li>
                                    <li>回到本頁按下方的
                                        <strong>「重新偵測」</strong>，欄位就會解鎖</li>
                                </ol>
                                <p class="modal-note">
                                    RC 模式下可設 <strong>1–10 A、每 1 A 一階</strong>，比旋鈕刻度
                                    （2/4/6/8/10 A）更細。
                                </p>

                                <h4 class="modal-sub">方式 B：直接用旋鈕設定（不需要本頁）</h4>
                                <ol class="modal-steps">
                                    <li>將旋鈕轉到目標安培數（例如 4A）</li>
                                    <li>通道 LED 開始閃爍（「待確認」狀態）</li>
                                    <li><strong>長按 LED 按鈕 &gt; 2 秒</strong>存檔</li>
                                    <li>LED 停止閃爍 → 新安培已寫入裝置</li>
                                    <li>本頁約 1 秒後自動顯示更新後的額定電流</li>
                                </ol>

                                <p class="modal-warn">
                                    ⚠ 無論哪種方式，<strong>只轉旋鈕不會儲存</strong>，一定要長按 LED 按鈕 &gt; 2 秒。
                                    設定模式閒置 60 秒會自動退出，未存檔的變更會被捨棄。
                                </p>
                                <p class="modal-warn">
                                    ⓘ 本系統<strong>無法自動得知旋鈕轉到哪一格</strong>——EtherNet/IP 協定沒有提供旋鈕位置。
                                    所以每次轉動旋鈕後，都要按「重新偵測」讓系統重新確認。
                                </p>

                                <div class="modal-reprobe">
                                    <button class="btn" @click="reprobeNominal"
                                        :disabled="!state.connected || reprobeBusy">

                    <section class="panel" v-else>

                    <section class="panel" v-if="state.connected || deviceInfo">

                    <!-- ================= 原廠 Web 介面（webif）=================

                                </tr>
                                <tr v-if="webifInfo.source?.processdata">
                                    <td>即時量測</td>
                                    <td>
                                        {{ webifInfo.powermodule?.voltage ?? '—' }} V ·
                                        {{ webifInfo.powermodule?.totalcurrent ?? '—' }} A

                    <!-- LED 狀態 -->

                                    <tr>

                                    </tr>
                                    <tr>

                                        <td>可回復的錯誤（例如連線逾時）</td>
                                    </tr>
                                </table>

                                <p class="modal-note">依 ODVA EtherNet/IP Network Status LED 規範：</p>
                                <table class="net-info-table led-legend">
                                    <tr>
                                        <td><span class="led-dot led-lg led-off"></span></td>
                                        <td>熄滅</td>
                                        <td>尚未取得 IP 位址</td>

                                        <td><strong>至少有一條 CIP 連線在線上</strong></td>

                                    <tr>

                                        <td>一條以上的連線逾時</td>

                <!-- 連線設定 -->
                <template v-if="currentPage === 'connection'">
                    <section class="panel">
                        <h2>連線設定</h2>
                        <div class="conn-form-block">
                            <label class="field-label">設備 IP 位址</label>
                            <div class="conn-form">
                                <!-- 可自由輸入的下拉：歷史清單只是捷徑，永遠保留手動打字 -->
                                <div class="ip-picker" :class="{ open: ipPickerOpen }">
                                    <input v-model="ipInput" placeholder="192.168.50.111"
                                        @keyup.enter="doConnect" @keyup.esc="ipPickerOpen = false" />
                                    <button class="ip-picker-toggle" v-if="recentIps.length"
                                        @click="ipPickerOpen = !ipPickerOpen"
                                        :title="'最近連線過的 ' + recentIps.length + ' 台設備'">▾</button>
                                    <ul class="ip-picker-menu" v-if="ipPickerOpen && recentIps.length">
                                        <li v-for="d in recentIps" :key="d.ip">
                                            <button class="ip-picker-item" @click="pickRecent(d.ip)">
                                                <span class="ip-picker-ip">{{ d.ip }}</span>
                                                <span class="ip-picker-meta">
                                                    {{ d.name || '—' }}<template v-if="d.serial"> · S/N {{ d.serial
                                                        }}</template>
                                                </span>
                                            </button>
                                            <span class="ip-picker-time">{{ relTime(d.last_connected) }}</span>
                                            <button class="ip-picker-del" @click.stop="forgetRecent(d.ip)"
                                                title="從清單移除（不影響設備）">✕</button>
                                        </li>
                                    </ul>
                                </div>
                                <button class="btn" v-if="!state.connected" @click="doConnect" :disabled="connecting">{{
                                    connecting ? '連線中...' : '連線' }}</button>
                                <button class="btn btn-danger" v-else @click="doDisconnect">斷線</button>
                            </div>
                            <p class="err-msg" v-if="state.error">{{ state.error }}</p>
                            <p class="conn-status-text" v-if="state.connected">
                                ✅ 已連線至 {{ state.device_ip }}，{{ state.module_count }} 個模組
                            </p>
                        </div>

                        <!-- 找不到 IP 時的出路：直接在本頁掃描，不必先跑去「IP 設定」頁。
                             狀態與該頁共用，掃過一次兩邊都看得到結果。 -->
                        <div class="conn-scan">
                            <div class="action-row">
                                <button class="btn btn-ghost" @click="scanDevices" :disabled="ipScanBusy">
                                    {{ ipScanBusy ? '掃描中…' : '🔍 掃描網段找設備' }}
                                </button>
                                <select v-model="ipIfaceSel" class="iface-sel" title="多網卡環境請指定設備所在的網卡">
                                    <option value="">全部網卡</option>
                                    <option v-for="itf in ipIfaces" :key="itf.ip" :value="itf.ip">
                                        {{ itf.ip }} — {{ itf.description }}
                                    </option>
                                </select>
                                <span class="feedback-msg err" v-if="ipScanError">{{ ipScanError }}</span>
                            </div>
                            <template v-if="ipScanResult">
                                <table class="net-info-table data-table" v-if="ipScanResult.devices.length">
                                    <thead>
                                        <tr>
                                            <th>IP 位址</th>
                                            <th>名稱 / S/N</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="d in ipScanResult.devices" :key="d.ip">
                                            <td>{{ d.ip }}</td>
                                            <td>
                                                {{ d.name || '—' }}
                                                <span v-if="d.serial">（S/N: {{ d.serial }}）</span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm" @click="connectToFound(d.ip)"
                                                    :disabled="connecting || state.connected">連線</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p class="hint-text" v-else>
                                    未發現設備。請確認設備已上電、與本機同網段；多網卡環境請指定正確的掃描網卡。
                                </p>
                            </template>
                        </div>
                    </section>
                    <!-- 設備網路資訊 -->
                    <section class="panel" v-if="state.connected || networkInfo">
                        <h2>
                            設備網路資訊
                            <span v-if="!state.connected" class="net-info-stale">（上次連線資訊）</span>
                            <button v-if="state.connected" class="btn-refresh" @click="refreshNetworkInfo"
                                :disabled="networkInfoRefreshing" title="重新從設備讀取">↻</button>
                        </h2>
                        <div v-if="!networkInfo && state.connected" class="hint-text">讀取中...</div>
                        <table v-else-if="networkInfo" class="net-info-table">
                            <tr>
                                <td>主機名稱</td>
                                <td>{{ networkInfo.hostname || '—' }}</td>
                            </tr>
                            <tr>
                                <td>IP 位址</td>
                                <td>{{ networkInfo.ip || '—' }}</td>
                            </tr>
                            <tr>
                                <td>子網路遮罩</td>
                                <td>{{ networkInfo.subnet_mask || '—' }}</td>
                            </tr>
                            <tr>
                                <td>預設閘道</td>
                                <td>{{ (networkInfo.gateway && networkInfo.gateway !== '0.0.0.0') ? networkInfo.gateway
                                    : '—' }}</td>
                            </tr>
                            <tr>
                                <td>MAC 位址</td>
                                <td class="net-mac">{{ networkInfo.mac || '—' }}</td>
                            </tr>
                        </table>
                    </section>
                </template>

                <!-- 設備 IP 設定 -->
                <template v-if="currentPage === 'ip-config'">

                    <!-- 1. 搜尋設備（不需先連線） -->
                    <section class="panel">
                        <h2>搜尋設備</h2>
                        <p class="hint-text">
                            以 EtherNet/IP 廣播尋找網路上的 CAPAROC；無回應時自動改查 ARP 表。此功能不需先連線。
                        </p>

                        <div class="conn-form-block">
                            <label class="field-label">掃描網卡</label>
                            <div class="conn-form">
                                <select v-model="ipIfaceSel">
                                    <option value="">全部網卡</option>
                                    <option v-for="itf in ipIfaces" :key="itf.ip" :value="itf.ip">
                                        {{ itf.ip }} — {{ itf.description }}
                                    </option>
                                </select>
                                <button class="btn btn-sm btn-ghost" @click="fetchIfaces" title="重新列舉網卡">↻</button>
                            </div>
                            <p class="hint-text">
                                多網卡環境請指定設備所在的網卡；選「全部網卡」時由作業系統決定廣播送往哪個介面，可能掃不到。
                            </p>
                        </div>

                        <div class="action-row">
                            <button class="btn" @click="scanDevices" :disabled="ipScanBusy">
                                {{ ipScanBusy ? '掃描中…' : '🔍 掃描網段' }}
                            </button>
                            <span class="feedback-msg err" v-if="ipScanError">{{ ipScanError }}</span>
                        </div>

                        <div v-if="ipScanResult">
                            <p class="hint-text" v-if="ipScanResult.broadcasts">
                                廣播位址：{{ ipScanResult.broadcasts.join(', ') }}
                                <span v-if="ipScanResult.via">｜命中方式：{{ ipScanResult.via }}</span>
                            </p>
                            <table class="net-info-table data-table" v-if="ipScanResult.devices.length">
                                <thead>
                                    <tr>
                                        <th>IP 位址</th>
                                        <th>MAC 位址</th>
                                        <th>名稱 / S/N</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="d in ipScanResult.devices" :key="d.ip">
                                        <td>{{ d.ip }}</td>
                                        <td class="net-mac">{{ d.mac || '—' }}</td>
                                        <td>
                                            {{ d.name || '—' }}
                                            <span v-if="d.serial">（S/N: {{ d.serial }}）</span>
                                        </td>
                                        <td>
                                            <button class="btn btn-sm" @click="connectToFound(d.ip)"
                                                :disabled="connecting">連線</button>
                                            <button class="btn btn-sm btn-ghost" @click="useFoundIp(d.ip)"
                                                title="填入下方「變更設備 IP」的目標欄位">帶入</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div v-else class="placeholder">
                                <div class="placeholder-icon">🔍</div>
                                <div class="placeholder-title">未發現設備</div>
                                <div class="placeholder-desc">請確認設備已上電且與本機在同一網段</div>
                            </div>
                        </div>
                    </section>

                    <!-- 2. 目前網路設定（需連線） -->
                    <section class="panel">
                        <h2>
                            目前網路設定
                            <span v-if="!state.connected && ipCurrent" class="net-info-stale">（上次連線資訊）</span>
                            <button v-if="state.connected" class="btn-refresh" @click="refreshIpCurrent"
                                :disabled="ipCurrentRefreshing" title="重新從設備讀取">↻</button>
                        </h2>
                        <div v-if="!state.connected && !ipCurrent" class="placeholder">
                            <div class="placeholder-icon">🌐</div>
                            <div class="placeholder-title">尚未連線</div>
                            <div class="placeholder-desc">請先連線至設備，或用上方「搜尋設備」找出設備 IP</div>
                        </div>
                        <template v-else>
                            <div v-if="!state.connected" class="stale-banner">⚠ 資料已停止更新，顯示斷線前最後資料</div>
                            <div v-if="!ipCurrent && state.connected" class="hint-text">讀取中...</div>
                            <table v-else-if="ipCurrent" class="net-info-table">
                                <tr>
                                    <td>IP 取得方式</td>
                                    <td>{{ ipCurrent.config_control_str || '—' }}</td>
                                </tr>
                                <tr>
                                    <td>IP 位址</td>
                                    <td>{{ ipCurrent.ip || '—' }}</td>
                                </tr>
                                <tr>
                                    <td>子網路遮罩</td>
                                    <td>{{ ipCurrent.subnet || '—' }}</td>
                                </tr>
                                <tr>
                                    <td>預設閘道</td>
                                    <td>{{ (ipCurrent.gateway && ipCurrent.gateway !== '0.0.0.0') ? ipCurrent.gateway : '—' }}</td>
                                </tr>
                            </table>
                            <p class="err-msg" v-if="ipCurrent && ipCurrent.error">{{ ipCurrent.error }}</p>
                        </template>
                    </section>

                    <!-- 3. 變更設備 IP（需連線） -->
                    <section class="panel" v-if="state.connected">
                        <h2>變更設備 IP</h2>

                        <label class="field-label">設定方式</label>
                        <div class="radio-row">
                            <label><input type="radio" value="static" v-model="ipMode" /> 靜態 IP</label>
                            <label><input type="radio" value="dhcp" v-model="ipMode" /> DHCP</label>
                        </div>

                        <template v-if="ipMode === 'static'">
                            <div class="form-grid">
                                <div>
                                    <label class="field-label">IP 位址</label>
                                    <input v-model="ipForm.ip" placeholder="192.168.50.111" />
                                </div>
                                <div>
                                    <label class="field-label">子網路遮罩</label>
                                    <input v-model="ipForm.subnet" placeholder="255.255.255.0" />
                                </div>
                                <div>
                                    <label class="field-label">預設閘道（可留空）</label>
                                    <input v-model="ipForm.gateway" placeholder="0.0.0.0" />
                                </div>
                            </div>
                            <p class="hint-text" v-if="ipSubnetWarning">{{ ipSubnetWarning }}</p>
                        </template>

                        <div class="stale-banner" v-else>
                            ⚠ 切換為 DHCP 前請先確認：<b>這個網段上真的有 DHCP server</b>。
                            若設備直連電腦或網段沒有 DHCP server，設備會拿不到位址而<b>完全失聯</b>，
                            屆時只能用 CLI 的迷你 DHCP server 救回：
                            <code>python src/caparoc_ip_config.py</code> → [2] 新裝置初始設定（需設備 MAC）。
                            <br />建議先記下設備 MAC（見上方掃描結果）再切換。
                        </div>

                        <div class="action-row">
                            <button class="btn btn-danger" @click="openIpConfirm" :disabled="ipApplyBusy">
                                {{ ipApplyBusy ? '處理中…' : (ipMode === 'static' ? '套用靜態 IP' : '切換為 DHCP') }}
                            </button>
                            <span class="feedback-msg" :class="ipApplyFeedback.ok ? 'ok' : 'err'"
                                v-if="ipApplyFeedback.msg">{{ ipApplyFeedback.msg }}</span>
                        </div>
                    </section>

                    <!-- 4. 失聯設備救援（進階／例外流程，預設收合） -->
                    <details class="panel adv-panel">
                        <summary>
                            找不到設備？（DHCP 失聯救援）
                            <span class="summary-hint">設備切成 DHCP 卻拿不到位址時用這裡救回</span>
                        </summary>

                        <p class="hint-text">
                            設備切成 DHCP、但網段上沒有 DHCP server 時，它拿不到位址，掃描與 ARP 都找不到它 ——
                            但它會持續送出 DHCP Discover 廣播。這裡監聽該廣播取得設備 MAC，再指派一個 IP 給它並固化為靜態 IP。
                            （等同 CLI 的「[2] 新裝置初始設定」）
                        </p>

                        <div class="action-row">
                            <button class="btn" @click="detectMac" :disabled="macBusy">
                                {{ macBusy ? '監聽中…最長 90 秒' : '📡 偵測 DHCP 廣播中的設備' }}
                            </button>
                            <button class="btn btn-ghost" v-if="macBusy" @click="cancelDhcpOp"
                                :disabled="dhcpCancelBusy">✕ 中斷</button>
                            <span class="feedback-msg err" v-if="macError">{{ macError }}</span>
                        </div>

                        <div v-if="macList">
                            <table class="net-info-table data-table" v-if="macList.length">
                                <thead>
                                    <tr>
                                        <th>選擇</th>
                                        <th>MAC 位址</th>
                                        <th>Discover 次數</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="m in macList" :key="m.mac">
                                        <td><input type="radio" :value="m.mac" v-model="rescueMac" /></td>
                                        <td class="net-mac">{{ m.mac }}</td>
                                        <td>{{ m.count }}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <p v-else class="hint-text">
                                未偵測到任何 DHCP 廣播。設備的重試間隔會逐次拉長（實測約每 60 秒一次），可再按一次；
                                也請確認網路線已接上、網卡選對，或重插設備網路線強制它立刻重試。
                            </p>
                        </div>

                        <template v-if="rescueMac">
                            <label class="field-label" style="margin-top:14px">指派給 {{ rescueMac }} 的網路設定</label>
                            <div class="form-grid">
                                <div>
                                    <label class="field-label">IP 位址</label>
                                    <input v-model="rescueIp" placeholder="192.168.50.111" />
                                </div>
                                <div>
                                    <label class="field-label">子網路遮罩</label>
                                    <input v-model="rescueSubnet" placeholder="255.255.255.0" />
                                </div>
                                <div>
                                    <label class="field-label">預設閘道（可留空）</label>
                                    <input v-model="rescueGateway" placeholder="0.0.0.0" />
                                </div>
                            </div>
                            <div class="action-row">
                                <button class="btn btn-danger" @click="rescueDevice" :disabled="rescueBusy">
                                    {{ rescueBusy ? '救援中…' : '指派並固化為靜態 IP' }}
                                </button>
                                <button class="btn btn-ghost" v-if="rescueBusy" @click="cancelDhcpOp"
                                    :disabled="dhcpCancelBusy">✕ 中斷</button>
                                <span class="feedback-msg" :class="rescueFeedback.ok ? 'ok' : 'err'"
                                    v-if="rescueFeedback.msg">{{ rescueFeedback.msg }}</span>
                            </div>
                            <p class="hint-text">按下後最長等 2 分鐘讓設備送出 DHCP 請求。</p>
                        </template>
                    </details>

                    <!-- 確認對話框 -->
                    <div class="modal-overlay" v-if="ipConfirmOpen" @click.self="ipConfirmOpen = false">
                        <div class="modal-box wide">
                            <div class="modal-header">
                                <span>確認變更設備 IP</span>
                                <button class="modal-close" @click="ipConfirmOpen = false">✕</button>
                            </div>
                            <div class="modal-body">
                                <table class="net-info-table">
                                    <tr>
                                        <td>目前 IP</td>
                                        <td>{{ (ipCurrent && ipCurrent.ip) || state.device_ip || '—' }}</td>
                                    </tr>
                                    <tr v-if="ipMode === 'static'">
                                        <td>變更為</td>
                                        <td>{{ ipForm.ip }} / {{ ipForm.subnet }}
                                            <span v-if="ipForm.gateway">（GW {{ ipForm.gateway }}）</span>
                                        </td>
                                    </tr>
                                    <tr v-else>
                                        <td>變更為</td>
                                        <td>DHCP（由 DHCP server 指派）</td>
                                    </tr>
                                </table>
                                <p class="hint-text" v-if="ipMode === 'static'">
                                    套用後設備連線會立即中斷，伺服器會自動等待設備上線並重新連線（最長 30 秒）。
                                </p>
                                <p class="hint-text" v-else>
                                    套用後連線會中斷，且新 IP 無法預知，需自行用「搜尋設備」找回。
                                    <b>若此網段沒有 DHCP server，設備將失聯</b>，需以 CLI 的迷你 DHCP server 救回。
                                </p>
                                <p class="hint-text" v-if="ipSubnetWarning">{{ ipSubnetWarning }}</p>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-ghost" @click="ipConfirmOpen = false">取消</button>
                                <button class="btn btn-danger" @click="applyIpChange">確認送出</button>
                            </div>
                        </div>
                    </div>
                </template>

            </main>
        </div>

    </div>


    <!-- 前端函式庫一律走本機 /static/vendor，離線（無外網）環境也能正常渲染 -->
    <script src="/static/vendor/chart.umd.min.js?v=4.4.6"></script>
    <script src="/static/vendor/hammer.min.js?v=2.0.8"></script>
    <script src="/static/vendor/chartjs-plugin-zoom.min.js?v=2.2.0"></script>
    <script src="/static/vendor/vue.global.prod.js?v=3.5.42"></script>
    <script src="/static/js/app.js?v={{ app_version }}"></script>
</body>

</html>
