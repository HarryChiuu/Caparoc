<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPAROC ?批??/title>
    <link rel="stylesheet" href="/static/css/style.css?v=4.2" />
</head>
<body>
    <div id="app">

        <!-- ??箏???-->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" @click="toggleSidebar" title="撅?/?嗅??詨">??/button>
                <span class="brand">CAPAROC</span>
            </div>
            <div class="conn-bar">
                <span class="dot" :class="state.connected ? 'dot-on' : 'dot-off'"></span>
                <span class="conn-label">
                    {{ state.connected ? '撌脤?? 繚 ' + state.device_ip : '?芷??' }}
                </span>
                <button class="btn-sm" v-if="!state.connected" @click="doConnect">???</button>
                <button class="btn-sm btn-danger" v-else @click="doDisconnect">?瑞?</button>
            </div>
        </header>

        <!-- 銝餌???-->
        <div class="layout">

            <!-- 撌血撠汗??-->
            <nav class="sidebar" :class="{ collapsed: sidebarCollapsed }">
                <ul class="nav-list">
                    <li v-for="item in navItems" :key="item.page"
                        class="nav-item"
                        :class="{ active: currentPage === item.page }"
                        @click="navigate(item.page)">
                        <span class="nav-icon">{{ item.icon }}</span>
                        <span class="nav-label">{{ item.label }}</span>
                    </li>
                </ul>
            </nav>

            <!-- 銝餃摰孵???-->
            <main class="main-content">

                <!-- ?? ?銵冽 ?? -->
                <template v-if="currentPage === 'dashboard'">

                    <section class="panel" v-if="state.connected">
                        <h2>蝟餌絞???/h2>
                        <div class="sys-grid">
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.voltage) }}<span class="unit">V</span></div>
                                <div class="stat-label">頛詨?餃?</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ fmt(state.total_current) }}<span class="unit">A</span></div>
                                <div class="stat-label">蝮賡瘚?/div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val">{{ state.module_count }}</div>
                                <div class="stat-label">璅∠??賊?</div>
                            </div>
                            <div class="stat-box" v-if="state.undervoltage || state.overvoltage || state.system_error">
                                <div class="stat-val warn-text">??/div>
                                <div class="stat-label">
                                    <span v-if="state.undervoltage">甈? </span>
                                    <span v-if="state.overvoltage">?? </span>
                                    <span v-if="state.system_error">蝟餌絞?航炊</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel" v-if="state.connected && state.channels.length">
                        <h2>???批</h2>
                        <div class="ch-grid">
                            <div class="ch-card"
                                 v-for="ch in state.channels" :key="ch.id"
                                 :class="cardClass(ch)">
                                <div class="ch-top">
                                    <span class="ch-name">CH{{ ch.id }}</span>
                                    <span class="ch-mod">M{{ ch.module }}</span>
                                    <button class="toggle-btn" @click="toggleCh(ch)">
                                        {{ ch.on ? '??' : '??' }}
                                    </button>
                                </div>
                                <div class="ch-current">{{ fmt(ch.current_amps) }} <span class="unit">A</span></div>
                                <div class="bar-wrap">
                                    <div class="bar-fill" :style="{ width: barPct(ch) + '%' }"
                                         :class="barClass(ch)"></div>
                                </div>
                                <div class="ch-meta">
                                    憿? {{ ch.nominal_amps }} A
                                    <span class="pct">{{ barPct(ch).toFixed(0) }}%</span>
                                </div>
                                <div class="ch-flags">
                                    <span class="flag warn" v-if="ch.warn_80">80%</span>
                                    <span class="flag fault" v-if="ch.overload">??</span>
                                    <span class="flag fault" v-if="ch.short_circuit">?剛楝</span>
                                    <span class="flag fault" v-if="ch.hardware_fault">蝖祇???</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel center" v-if="!state.connected">
                        <h2>撠???</h2>
                        <p class="hint-text">隢?敺???閮剖????Ｗ遣蝡??</p>
                        <button class="btn" style="margin-top:16px" @click="navigate('connection')">?????閮剖?</button>
                    </section>

                </template>

                <!-- ?? ?”?? ?? -->
                <template v-if="currentPage === 'charts'">
                    <section class="panel">
                        <h2>?”??</h2>
                        <div class="placeholder">
                            <div class="placeholder-icon">??</div>
                            <div class="placeholder-title">?銝?/div>
                            <div class="placeholder-desc">?餅?/?餃?甇瑕?脩???隞餃? 4嚗?/div>
                        </div>
                    </section>
                </template>

                <!-- ?? ??閮剖? ?? -->
                <template v-if="currentPage === 'channel-settings'">
                    <section class="panel">
                        <h2>??閮剖?</h2>
                        <div class="placeholder">
                            <div class="placeholder-icon">??</div>
                            <div class="placeholder-title">?銝?/div>
                            <div class="placeholder-desc">憿??餅?閮剖?嚗遙??2嚗?/div>
                        </div>
                    </section>
                </template>

                <!-- ?? 蝟餌絞?亥? ?? -->
                <template v-if="currentPage === 'logs'">
                    <section class="panel">
                        <h2>蝟餌絞?亥?</h2>
                        <div class="placeholder">
                            <div class="placeholder-icon">??</div>
                            <div class="placeholder-title">?銝?/div>
                            <div class="placeholder-desc">敺垢?亥??亦?嚗遙??3嚗?/div>
                        </div>
                    </section>
                </template>

                <!-- ?? ???閮剖? ?? -->
                <template v-if="currentPage === 'connection'">
                    <section class="panel">
                        <h2>???閮剖?</h2>
                        <div class="conn-form-block">
                            <label class="field-label">閮剖? IP 雿?</label>
                            <div class="conn-form">
                                <input v-model="ipInput" placeholder="192.168.2.111" @keyup.enter="doConnect" />
                                <button class="btn" v-if="!state.connected" @click="doConnect">???</button>
                                <button class="btn btn-danger" v-else @click="doDisconnect">?瑞?</button>
                            </div>
                            <p class="err-msg" v-if="state.error">{{ state.error }}</p>
                            <p class="conn-status-text" v-if="state.connected">
                                ??撌脤????{{ state.device_ip }}嚗{ state.module_count }} ?芋蝯?
                            </p>
                        </div>
                    </section>
                </template>

            </main>
        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="/static/js/app.js?v=4.2"></script>
</body>
</html>
